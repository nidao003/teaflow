name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laravel
    env:
      COMPOSER_NO_SECURITY_BLOCKING: 1
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, gd, intl, zip
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: php artisan test
      - run: vendor/bin/pint --test app/Domain tests/Feature/Domain database/migrations/2026_10_26_2*.php database/seeders/OrgSeeder.php database/seeders/MemberSeeder.php database/seeders/ProductSeeder.php database/seeders/InventorySeeder.php
      - run: vendor/bin/phpstan analyse app/Domain --memory-limit=1G --no-progress
